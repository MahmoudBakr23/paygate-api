default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Fly Postgres routes connections through PgBouncer in transaction mode.
  # prepared_statements and advisory_locks are connection-pinned features that
  # break under a pooler — disable both to stay compatible.
  prepared_statements: false
  advisory_locks: false

development:
  <<: *default
  database: paygate_api_development

test:
  <<: *default
  database: paygate_api_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
